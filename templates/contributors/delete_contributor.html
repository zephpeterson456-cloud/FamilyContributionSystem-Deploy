{% extends 'base.html' %}

{% block title %}Delete Contributor{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">
        <div class="card-body">

            <h3>Delete Contributor</h3>

            <p>
                Are you sure you want to delete
                <strong>{{ contributor.full_name }}</strong>?
            </p>

            <form method="post">
                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    Yes, Delete
                </button>

                <a href="{% url 'contributor_list' %}" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>

{% endblock %}
