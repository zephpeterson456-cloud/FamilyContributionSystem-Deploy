<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Family Contribution System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            min-height: 100vh;
            background: #f5f7fb;
        }

        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 18px;
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            background: #0d6efd;
            color: white;
            font-size: 30px;
        }

        .login-title {
            font-weight: 700;
        }

        .form-control {
            padding: 12px;
            border-radius: 10px;
        }

        .login-btn {
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="card login-card shadow-lg">

        <div class="card-body p-4 p-md-5">

            <div class="brand-icon">
                <i class="bi bi-people-fill"></i>
            </div>

            <div class="text-center mb-4">

                <h3 class="login-title">
                    Family Contribution System
                </h3>

                <p class="text-muted mb-0">
                    Sign in to continue
                </p>

            </div>

            {% if form.errors %}
                <div class="alert alert-danger">
                    <i class="bi bi-exclamation-circle"></i>
                    Invalid username or password.
                </div>
            {% endif %}

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit"
                        class="btn btn-primary w-100 login-btn">

                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Sign In

                </button>

            </form>

            <div class="text-center mt-4">
                <small class="text-muted">
                    Family Contribution System
                </small>
            </div>

        </div>

    </div>

</div>

</body>
</html>
