{% extends 'base.html' %}

{% block title %}Edit Family{% endblock %}

{% block content %}

<div class="card">
    <div class="card-body">

        <h3>Edit Family</h3>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Save Changes
            </button>

            <a href="{% url 'family_list' %}" class="btn btn-secondary">
                Cancel
            </a>
        </form>

    </div>
</div>

{% endblock %}
